name: Build lesson pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lessons*.js'
      - 'app3.js'
      - 'hi_lessons.js'
      - 'viz*.js'
      - 'tools/gen.js'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make pages
        run: node tools/gen.js . .
      - name: Save new pages
        run: |
          git config user.name "lesson-pages-bot"
          git config user.email "bot@users.noreply.github.com"
          git add learn sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Update lesson pages" && git push)
